stages:
  - build_base
  - lint
  - test
  - publish

variables:
  # Computed rather than read from a project CI/CD variable. $CI_REGISTRY_IMAGE
  # is registry.gitlab.com/<project path>, so this needs no maintenance, cannot
  # drift from the project it belongs to, and — unlike a *protected* project
  # variable, which GitLab exposes only to protected branches — is available to
  # branch pipelines. A project-level BASE_IMAGE still takes precedence over
  # this, so delete that variable to leave one source of truth.
  BASE_IMAGE: $CI_REGISTRY_IMAGE/base:latest

build_base:
  stage: build_base
  # Scoped to the default branch because the job pushes the shared
  # `base:latest` tag that every other pipeline pulls — a feature branch
  # building it would replace the base image for everyone. Note also that a
  # `changes:` rule matches *every* file on a branch's first push, so without
  # the branch condition this job fires on each new branch no matter what the
  # branch touched.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BUILD_BASE_IMAGE == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - Dockerfile.base
          - .tool-versions
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker buildx build -f Dockerfile.base -t $BASE_IMAGE .
    - docker push $BASE_IMAGE

lint:
  stage: lint
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $BASE_IMAGE
    - docker run --rm -v $CI_PROJECT_DIR:/app -w /app $BASE_IMAGE
        sh -c "mix deps.get && mix format --check-formatted && mix dialyzer"

test:
  stage: test
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $BASE_IMAGE
    - docker run --rm -v $CI_PROJECT_DIR:/app -w /app -e MIX_ENV=test $BASE_IMAGE
        sh -c "mix deps.get && mix test"

publish_hex:
  stage: publish
  when: manual
  allow_failure: true
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $BASE_IMAGE
    - docker run --rm -v $CI_PROJECT_DIR:/app -w /app
        -e MIX_ENV=dev
        -e HEX_API_KEY=$HEX_API_KEY
        $BASE_IMAGE
        sh -c "mix deps.get && mix hex.config api_key \$HEX_API_KEY && mix hex.publish --yes"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
