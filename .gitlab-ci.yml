stages:
  - build_base
  - lint
  - test
  - publish

build_base:
  stage: build_base
  rules:
    - if: $BUILD_BASE_IMAGE == "true"
    - changes:
        paths:
          - Dockerfile.base
          - .tool-versions
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker buildx build -f Dockerfile.base -t $BASE_IMAGE .
    - docker push $BASE_IMAGE

lint:
  stage: lint
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $BASE_IMAGE
    - docker run --rm -v $CI_PROJECT_DIR:/app -w /app $BASE_IMAGE
        sh -c "mix deps.get && mix format --check-formatted && mix dialyzer"

test:
  stage: test
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $BASE_IMAGE
    - docker run --rm -v $CI_PROJECT_DIR:/app -w /app -e MIX_ENV=test $BASE_IMAGE
        sh -c "mix deps.get && mix test"

publish_hex:
  stage: publish
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $BASE_IMAGE
    - docker run --rm -v $CI_PROJECT_DIR:/app -w /app -e MIX_ENV=prod -e HEX_API_KEY=$HEX_API_KEY $BASE_IMAGE
        sh -c "mix deps.get && mix hex.config api_key \$HEX_API_KEY && mix hex.publish --yes"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
